<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedChat - Pro Edition</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Ikòn Pro -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container active" id="mainApp">
        <!-- Header ak Logo Pro -->
        <header class="chat-header">
            <div class="logo-container">
                <!-- Logo FedChat SVG -->
                <svg width="130" height="35" viewBox="0 0 150 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20 L25 5 L40 20 L25 35 Z" fill="url(#gradient)"/>
                    <text x="50" y="28" font-family="'Poppins', sans-serif" font-weight="bold" font-size="24" fill="#ffffff">Fed<tspan fill="#00ffcc">Chat</tspan></text>
                    <defs>
                        <linearGradient id="gradient" x1="10" y1="5" x2="40" y2="35" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00ffcc"/>
                            <stop offset="1" stop-color="#0088cc"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="header-actions">
                <button class="pro-btn-icon" title="Apèl Odyo"><i class="fa-solid fa-phone"></i></button>
                <button class="pro-btn-icon" title="Apèl Videyo"><i class="fa-solid fa-video"></i></button>
                <button class="pro-btn-icon" title="Anviwònman"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>
        </header>

        <div class="chat-body-wrapper">
            <!-- Sidebar -->
            <aside class="contacts-sidebar">
                <h3><i class="fa-solid fa-users"></i> Kontak</h3>
                <div class="user-item">
                    <div class="status-indicator status-online"></div>
                    <span>Valentia</span>
                </div>
            </aside>

            <!-- Zòn Chat Prensipal la -->
            <main class="chat-main-column">
                <div class="messages-area" id="messagesArea">
                    <div class="system-message">Koneksyon sekirize. Kòmanse pale.</div>
                    <!-- Mesaj yo ap parèt isit la -->
                </div>

                <!-- Panèl Stickers (Kache pa defo) -->
                <div class="stickers-panel" id="stickersPanel">
                    <img src="https://cdn-icons-png.flaticon.com/128/4786/4786093.png" class="sticker-item" alt="Sticker 1">
                    <img src="https://cdn-icons-png.flaticon.com/128/4786/4786105.png" class="sticker-item" alt="Sticker 2">
                    <img src="https://cdn-icons-png.flaticon.com/128/4786/4786071.png" class="sticker-item" alt="Sticker 3">
                </div>

                <div class="input-area">
                    <button class="pro-btn-icon" id="toggleStickers" title="Stickers"><i class="fa-solid fa-face-smile"></i></button>
                    
                    <label for="imageUpload" class="pro-btn-icon" title="Voye Foto">
                        <i class="fa-solid fa-image"></i>
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                    
                    <button class="pro-btn-icon" id="recordVoiceBtn" title="Voye Vwa"><i class="fa-solid fa-microphone"></i></button>
                    
                    <input type="text" id="messageInput" placeholder="Ekri yon mesaj...">
                    
                    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase Scripts (Mete vèsyon ou abitye itilize yo la) -->
    <!-- <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script> -->
    <!-- <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script> -->
    
    <script src="app.js"></script>
</body>
</html>
